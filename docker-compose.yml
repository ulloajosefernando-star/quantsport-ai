# Despliegue en un solo equipo o VPS. Uso: cp .env.example .env && docker compose up -d --build
# La interfaz queda en http://localhost:8080. Fuera de APP_ENV=local define ADMIN_TOKEN en .env.
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/quantsport.db
      CACHE_DIR: /data/cache
      IMPORTS_DIR: /data/imports
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 60s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
